<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#ffffff">

    <title>CHUK AN CHUKK</title>

    <link rel="stylesheet" href="style.css">

    <!-- Pi SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <style>

        /* =====================================
           PI LOGIN HEADER
        ====================================== */

        .pi-login-header {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        #piLoginButton {
            min-height: 40px;
            padding: 8px 14px;
            border: 0;
            border-radius: 12px;
            background: #6b2cff;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        #piLoginButton:disabled {
            opacity: .65;
            cursor: wait;
        }

        #piLoginStatus {
            display: none;
            font-size: 11px;
            color: #777;
            width: 100%;
        }

        /* =====================================
           USER LOGIN INFO
        ====================================== */

        .logged-user {
            display: none;
            align-items: center;
            gap: 8px;
            margin-left: 8px;
        }

        .logged-user.visible {
            display: flex;
        }

        .logout-button {
            border: 0;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
        }

        /* =====================================
           APP SELALU TERLIHAT
        ====================================== */

        #chukApp {
            display: block;
        }

    </style>

</head>


<body>


<!-- =====================================
     CHUK AN CHUKK APP
===================================== -->

<div
    id="chukApp"
    class="app"
>


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="header">


        <div class="logo-title">

            <img
                src="assets/logo.png"
                class="logo"
                alt="CHUK AN CHUKK"
            >

            <span>
                CHUK AN CHUKK
            </span>

        </div>


        <div class="header-icons">


            <!-- LOGIN PI -->

            <div class="pi-login-header">

                <button
                    id="piLoginButton"
                    type="button"
                    aria-label="Login dengan Pi"
                    title="Login dengan Pi"
                >
                    Login with Pi
                </button>

                <div
                    id="piLoginStatus"
                    aria-live="polite"
                >
                    Siap untuk login dengan Pi
                </div>

            </div>


            <!-- LIVE -->

            <button
                type="button"
                class="live-header-button"
                onclick="window.location.href='live-hub.html'"
                aria-label="Live"
                title="Live"
            >
                🔴 LIVE
            </button>


            <!-- SEARCH -->

            <button
                type="button"
                onclick="searchPost()"
                aria-label="Cari postingan"
                title="Cari"
            >
                🔍
            </button>


            <!-- NOTIFICATION -->

            <button
                type="button"
                onclick="showNotifications()"
                aria-label="Notifikasi"
                title="Notifikasi"
            >
                🔔
            </button>


        </div>

    </header>


    <!-- =====================================
         USER INFO
    ====================================== -->

    <div
        id="loggedUser"
        class="logged-user"
    >

        <span id="loggedUsername"></span>

        <button
            type="button"
            class="logout-button"
            id="logoutButton"
            aria-label="Logout"
            title="Logout"
        >
            ⎋
        </button>

    </div>


    <!-- =====================================
         FEED
    ====================================== -->

    <main
        id="feed"
        class="feed"
    >

        <div class="empty-feed">
            ⏳ Memuat postingan...
        </div>

    </main>


    <!-- =====================================
         CREATE POST
    ====================================== -->

    <button
        type="button"
        class="compose-button"
        onclick="window.location.href='post.html'"
        aria-label="Buat postingan"
        title="Buat postingan"
    >
        ＋
    </button>


    <!-- =====================================
         BOTTOM NAVIGATION
    ====================================== -->

    <nav
        class="bottom-nav"
        aria-label="Navigasi utama"
    >


        <!-- HOME -->

        <button
            type="button"
            onclick="goHome()"
            aria-label="Home"
        >

            <span>🏠</span>

            <small>
                Home
            </small>

        </button>


        <!-- CHAT -->

        <button
            type="button"
            onclick="goChat()"
            aria-label="Chat"
        >

            <span>💬</span>

            <small>
                Chat
            </small>

        </button>


        <!-- PROFILE -->

        <button
            type="button"
            onclick="goProfile()"
            aria-label="Profile"
        >

            <span>👤</span>

            <small>
                Profile
            </small>

        </button>


    </nav>


</div>


<!-- =====================================
     SUPABASE
===================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

    if (window.chukSupabase) {

        window.supabase =
            window.chukSupabase;

        console.log(
            "✅ CHUK Supabase Client aktif"
        );

    } else {

        console.error(
            "❌ CHUK Supabase Client tidak ditemukan"
        );

    }

</script>


<!-- =====================================
     MAIN SCRIPT
===================================== -->

<script src="script.js"></script>


</body>

</html>
