<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHUK AN CHUKK</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="logo-title">

            <img
                src="assets/logo.png"
                class="logo"
                alt="Logo">

            <span>CHUK AN CHUKK</span>

        </div>

        <div class="header-icons">

            <button onclick="searchPost()">
                🔍
            </button>

            <button onclick="showNotifications()">
                🔔
            </button>

        </div>

    </header>


    <!-- FEED -->

    <main
        class="feed"
        id="feed">

        <div style="
            text-align:center;
            padding:40px;
        ">
            ⏳ Memuat postingan...
        </div>

    </main>


    <!-- BOTTOM NAVIGATION -->

    <nav class="bottom-nav">

        <button onclick="goHome()">

            🏠

            <span>
                Home
            </span>

        </button>


        <button
            onclick="window.location.href='post.html'">

            ➕

            <span>
                Post
            </span>

        </button>


        <button onclick="goChat()">

            💬

            <span>
                Chat
            </span>

        </button>


        <button onclick="goProfile()">

            👤

            <span>
                Profile
            </span>

        </button>

    </nav>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="script.js"></script>


<script>

/* =====================================
   CHUK AN CHUKK
   LOAD POSTS
===================================== */

async function loadPosts() {

    const sb = window.chukSupabase;

    const feed =
        document.getElementById("feed");


    /* ==========================
       CHECK SUPABASE
    ========================== */

    if (!sb) {

        console.error(
            "❌ Supabase Client tidak ditemukan"
        );

        feed.innerHTML = `

            <div style="
                text-align:center;
                padding:40px;
            ">

                ❌ Supabase belum siap.

            </div>

        `;

        return;
    }


    /* ==========================
       LOAD POSTS
    ========================== */

    console.log(
        "⏳ Mengambil postingan..."
    );


    const {
        data,
        error
    } = await sb

        .from("posts")

        .select("*")

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    /* ==========================
       DATABASE ERROR
    ========================== */

    if (error) {

        console.error(
            "❌ LOAD POSTS ERROR:",
            error
        );

        feed.innerHTML = `

            <div style="
                text-align:center;
                padding:40px;
            ">

                ❌ Gagal memuat postingan.

                <br><br>

                ${error.message}

            </div>

        `;

        return;
    }


    /* ==========================
       NO POSTS
    ========================== */

    if (!data || data.length === 0) {

        feed.innerHTML = `

            <div style="
                text-align:center;
                padding:40px;
            ">

                📭 Belum ada postingan.

                <br><br>

                <button
                    onclick="
                    window.location.href='post.html'
                    "
                    style="
                        padding:12px 20px;
                        border:none;
                        border-radius:10px;
                        cursor:pointer;
                    "
                >

                    ➕ Buat Postingan

                </button>

            </div>

        `;

        return;
    }


    /* ==========================
       CLEAR FEED
    ========================== */

    feed.innerHTML = "";


    /* ==========================
       RENDER POSTS
    ========================== */

    data.forEach(post => {

        const mediaUrl =
            post.media || "";

        let media = "";


        /* ==========================
           VIDEO
        ========================== */

        if (
            /\.(mp4|webm|mov|m4v)$/i
                .test(mediaUrl)
        ) {

            media = `

                <video
                    class="post-image"
                    controls
                    playsinline
                    preload="metadata"
                >

                    <source
                        src="${mediaUrl}"
                        type="video/mp4">

                    Browser Anda tidak
                    mendukung video.

                </video>

            `;

        }


        /* ==========================
           IMAGE
        ========================== */

        else {

            media = `

                <img
                    src="${mediaUrl}"
                    class="post-image"
                    alt="Post"
                    loading="lazy"
                    onerror="
                        this.style.display='none';
                    "
                >

            `;

        }


        /* ==========================
           LOCATION
        ========================== */

        const locationHTML =
            post.location
            ? `

                <small>
                    📍 ${post.location}
                </small>

              `
            : "";


        /* ==========================
           HASHTAGS
        ========================== */

        const hashtagHTML =
            post.hashtags
            ? `

                <div class="hashtags">
                    ${post.hashtags}
                </div>

              `
            : "";


        /* ==========================
           POST HTML
        ========================== */

        feed.innerHTML += `

            <article class="post">

                ${media}


                <div class="gradient">
                </div>


                <div class="post-overlay">


                    <div class="post-info">


                        <h3>
                            @ChukOfficial
                        </h3>


                        <p>
                            ${post.caption || ""}
                        </p>


                        ${locationHTML}


                        ${hashtagHTML}


                    </div>


                    <div class="post-actions">


                        <button
                            onclick="likePost()"
                            aria-label="Like"
                        >
                            ❤️
                        </button>


                        <button
                            onclick="commentPost()"
                            aria-label="Comment"
                        >
                            💬
                        </button>


                        <button
                            onclick="sharePost()"
                            aria-label="Share"
                        >
                            ↗️
                        </button>


                        <button
                            onclick="savePost()"
                            aria-label="Save"
                        >
                            🔖
                        </button>


                    </div>


                </div>


            </article>

        `;

    });


    console.log(
        "✅ Postingan berhasil dimuat:",
        data.length
    );

}


/* =====================================
   START
===================================== */

loadPosts();

</script>

</body>

</html>
