<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>CHUK AN CHUKK</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ==========================================
         HEADER APP
         ========================================== -->
    <header class="header">

        <div class="logo-title">

            <img
                src="assets/logo.png"
                class="logo"
                alt="CHUK AN CHUKK"
            >

            <span>CHUK AN CHUKK</span>

        </div>

        <div class="header-icons">

            <button
                type="button"
                onclick="searchPost()"
                aria-label="Cari"
            >
                🔍
            </button>

            <button
                type="button"
                onclick="showNotifications()"
                aria-label="Notifikasi"
            >
                🔔
            </button>

        </div>

    </header>


    <!-- ==========================================
         FEED POSTINGAN
         ========================================== -->

    <main
        class="feed"
        id="feed"
    >

        <div class="empty-feed">
            ⏳ Memuat postingan...
        </div>

    </main>


    <!-- ==========================================
         BOTTOM NAVIGATION
         ========================================== -->

    <nav class="bottom-nav">

        <button
            type="button"
            onclick="goHome()"
            aria-label="Home"
        >
            <span>🏠</span>
            <small>Home</small>
        </button>


        <button
            type="button"
            onclick="window.location.href='post.html'"
            aria-label="Post"
        >
            <span>➕</span>
            <small>Post</small>
        </button>


        <button
            type="button"
            onclick="goChat()"
            aria-label="Chat"
        >
            <span>💬</span>
            <small>Chat</small>
        </button>


        <button
            type="button"
            onclick="goProfile()"
            aria-label="Profile"
        >
            <span>👤</span>
            <small>Profile</small>
        </button>

    </nav>

</div>


<!-- ==========================================
     SUPABASE
     ========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>
    /*
    ==========================================
    AKTIFKAN CLIENT CHUK AN CHUKK
    ==========================================
    */

    if (window.chukSupabase) {

        window.supabase = window.chukSupabase;

        console.log(
            "✅ CHUK Supabase Client aktif"
        );

    } else {

        console.error(
            "❌ CHUK Supabase Client tidak ditemukan"
        );

    }
</script>


<!-- ==========================================
     SCRIPT UTAMA
     ========================================== -->

<script src="script.js"></script>

</body>
</html>
