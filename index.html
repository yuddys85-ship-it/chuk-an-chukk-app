<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#ffffff">

    <title>CHUK AN CHUKK</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<div class="app">


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="header">

        <div class="logo-title">

            <img
                src="assets/logo.png"
                class="logo"
                alt="CHUK AN CHUKK"
            >

            <span>CHUK AN CHUKK</span>

        </div>


        <div class="header-icons">

            <!-- LIVE -->
            <button
                type="button"
                class="live-header-button"
                onclick="window.location.href='live.html'"
                aria-label="Live"
                title="Mulai Live"
            >
                🔴 LIVE
            </button>


            <!-- SEARCH -->
            <button
                type="button"
                onclick="searchPost()"
                aria-label="Cari postingan"
            >
                🔍
            </button>


            <!-- NOTIFICATION -->
            <button
                type="button"
                onclick="showNotifications()"
                aria-label="Notifikasi"
            >
                🔔
            </button>

        </div>

    </header>



    <!-- =====================================
         FEED
    ====================================== -->

    <main
        id="feed"
        class="feed"
    >

        <div class="empty-feed">
            ⏳ Memuat postingan...
        </div>

    </main>



    <!-- =====================================
         CREATE POST
    ====================================== -->

    <button
        type="button"
        class="compose-button"
        onclick="window.location.href='post.html'"
        aria-label="Buat postingan"
        title="Buat postingan"
    >
        ＋
    </button>



    <!-- =====================================
         BOTTOM NAVIGATION
    ====================================== -->

    <nav
        class="bottom-nav"
        aria-label="Navigasi utama"
    >


        <!-- HOME -->

        <button
            type="button"
            onclick="goHome()"
            aria-label="Home"
        >

            <span>🏠</span>

            <small>Home</small>

        </button>



        <!-- CHAT -->

        <button
            type="button"
            onclick="goChat()"
            aria-label="Chat"
        >

            <span>💬</span>

            <small>Chat</small>

        </button>



        <!-- PROFILE -->

        <button
            type="button"
            onclick="goProfile()"
            aria-label="Profile"
        >

            <span>👤</span>

            <small>Profile</small>

        </button>


    </nav>


</div>



<!-- =====================================
     SUPABASE
====================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

    if (window.chukSupabase) {

        window.supabase =
            window.chukSupabase;

        console.log(
            "✅ CHUK Supabase Client aktif"
        );

    } else {

        console.error(
            "❌ CHUK Supabase Client tidak ditemukan"
        );

    }

</script>


<!-- =====================================
     MAIN SCRIPT
====================================== -->

<script src="script.js"></script>


</body>

</html>
