<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#ffffff">

    <title>CHUK AN CHUKK</title>

    <link rel="stylesheet" href="style.css">

    <!-- Pi SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <style>
        /* ================================
           PI LOGIN GATE
        ================================= */

        #piLoginGate {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            background:
                radial-gradient(circle at top,
                    rgba(111,214,214,.30),
                    transparent 45%),
                #ffffff;
        }

        .pi-login-card {
            width: min(380px, 100%);
            text-align: center;
            padding: 32px 24px;

            border-radius: 24px;

            background: rgba(255,255,255,.92);
            border: 1px solid rgba(0,0,0,.08);

            box-shadow:
                0 20px 60px rgba(0,0,0,.12);
        }

        .pi-login-logo {
            width: 92px;
            height: 92px;
            object-fit: contain;
            margin-bottom: 14px;
        }

        .pi-login-title {
            margin: 0;
            font-size: 25px;
            font-weight: 700;
        }

        .pi-login-subtitle {
            margin: 8px 0 24px;
            color: #777;
            font-size: 14px;
        }

        #piLoginButton {
            width: 100%;
            min-height: 50px;

            border: 0;
            border-radius: 14px;

            background: #6b2cff;
            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;
        }

        #piLoginButton:disabled {
            opacity: .65;
            cursor: wait;
        }

        #piLoginStatus {
            min-height: 20px;
            margin-top: 14px;

            font-size: 13px;
            color: #777;
        }

        /* App disembunyikan sampai login */
        #chukApp {
            display: none;
        }

        /* ================================
           USER LOGIN INFO
        ================================= */

        .logged-user {
            display: none;
            align-items: center;
            gap: 8px;
            margin-left: 8px;
        }

        .logged-user.visible {
            display: flex;
        }

        .logout-button {
            border: 0;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>

<body>

<!-- =====================================
     PI LOGIN GATE
===================================== -->

<section id="piLoginGate">

    <div class="pi-login-card">

        <img
            src="assets/logo.png"
            class="pi-login-logo"
            alt="CHUK AN CHUKK"
        >

        <h1 class="pi-login-title">
            CHUK AN CHUKK
        </h1>

        <p class="pi-login-subtitle">
            Live Social App for Pi Community
        </p>

        <button
            id="piLoginButton"
            type="button"
        >
            Login with Pi
        </button>

        <div
            id="piLoginStatus"
            aria-live="polite"
        >
            Siap untuk login dengan Pi
        </div>

    </div>

</section>


<!-- =====================================
     CHUK AN CHUKK APP
===================================== -->

<div
    id="chukApp"
    class="app"
>

    <header class="header">

        <div class="logo-title">

            <img
                src="assets/logo.png"
                class="logo"
                alt="CHUK AN CHUKK"
            >

            <span>
                CHUK AN CHUKK
            </span>

        </div>

        <div class="header-icons">

            <button
                type="button"
                class="live-header-button"
                onclick="window.location.href='live-hub.html'"
                aria-label="Live"
                title="Live"
            >
                🔴 LIVE
            </button>

            <button
                type="button"
                onclick="searchPost()"
                aria-label="Cari postingan"
            >
                🔍
            </button>

            <button
                type="button"
                onclick="showNotifications()"
                aria-label="Notifikasi"
            >
                🔔
            </button>

        </div>

    </header>


    <!-- USER INFO -->

    <div
        id="loggedUser"
        class="logged-user"
    >
        <span id="loggedUsername"></span>

        <button
            type="button"
            class="logout-button"
            id="logoutButton"
            aria-label="Logout"
            title="Logout"
        >
            ⎋
        </button>
    </div>


    <!-- FEED -->

    <main
        id="feed"
        class="feed"
    >

        <div class="empty-feed">
            ⏳ Memuat postingan...
        </div>

    </main>


    <!-- CREATE POST -->

    <button
        type="button"
        class="compose-button"
        onclick="window.location.href='post.html'"
        aria-label="Buat postingan"
        title="Buat postingan"
    >
        ＋
    </button>


    <!-- BOTTOM NAV -->

    <nav
        class="bottom-nav"
        aria-label="Navigasi utama"
    >

        <button
            type="button"
            onclick="goHome()"
            aria-label="Home"
        >
            <span>🏠</span>
            <small>Home</small>
        </button>

        <button
            type="button"
            onclick="goChat()"
            aria-label="Chat"
        >
            <span>💬</span>
            <small>Chat</small>
        </button>

        <button
            type="button"
            onclick="goProfile()"
            aria-label="Profile"
        >
            <span>👤</span>
            <small>Profile</small>
        </button>

    </nav>

</div>


<!-- =====================================
     SUPABASE
===================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script>
    if (window.chukSupabase) {

        window.supabase = window.chukSupabase;

        console.log(
            "✅ CHUK Supabase Client aktif"
        );

    } else {

        console.error(
            "❌ CHUK Supabase Client tidak ditemukan"
        );

    }
</script>


<!-- =====================================
     MAIN SCRIPT
===================================== -->

<script src="script.js"></script>

</body>
</html>
