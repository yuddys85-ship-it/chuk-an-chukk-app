<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>CHUK AN CHUKK</title>

<link
    rel="stylesheet"
    href="style.css">

</head>

<body>

<div class="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="logo-title">

            <img
                src="assets/logo.png"
                class="logo"
                alt="Chuk an Chukk">

            <span>
                CHUK AN CHUKK
            </span>

        </div>

        <div class="header-icons">

            <button
                type="button"
                onclick="searchPost()"
                aria-label="Cari">

                🔍

            </button>

            <button
                type="button"
                onclick="showNotifications()"
                aria-label="Notifikasi">

                🔔

            </button>

        </div>

    </header>


    <!-- =========================
         FEED
    ========================== -->

    <main
        class="feed"
        id="feed">

        <div
            style="
                width:100%;
                min-height:100dvh;
                display:flex;
                align-items:center;
                justify-content:center;
                text-align:center;
                color:#fff;
                background:#000;
                font-size:1.1rem;
            ">

            ⏳ Memuat postingan...

        </div>

    </main>


    <!-- =========================
         BOTTOM NAV
    ========================== -->

    <nav class="bottom-nav">

        <button
            type="button"
            onclick="goHome()">

            🏠

            <span>
                Home
            </span>

        </button>


        <button
            type="button"
            onclick="
                window.location.href='post.html'
            ">

            ➕

            <span>
                Post
            </span>

        </button>


        <button
            type="button"
            onclick="goChat()">

            💬

            <span>
                Chat
            </span>

        </button>


        <button
            type="button"
            onclick="goProfile()">

            👤

            <span>
                Profile
            </span>

        </button>

    </nav>

</div>


<!-- =========================
     SUPABASE LIBRARY
========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =========================
     CHUK SUPABASE CLIENT
========================== -->

<script src="supabase.js"></script>


<!-- =========================
     FIX SUPABASE CLIENT
========================== -->

<script>

    /*
     * supabase.js membuat:
     *
     * window.chukSupabase
     *
     * Sedangkan script.js menggunakan:
     *
     * supabase.from(...)
     *
     * Jadi kita arahkan supabase
     * ke client Chuk an Chukk.
     */

    if (window.chukSupabase) {

        window.supabase =
            window.chukSupabase;

        console.log(
            "✅ CHUK Supabase Client aktif"
        );

    } else {

        console.error(
            "❌ CHUK Supabase Client tidak ditemukan"
        );

    }

</script>


<!-- =========================
     MAIN SCRIPT
========================== -->

<script src="script.js"></script>


</body>
</html>
