<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile - CHUK AN CHUKK</title>
<link rel="stylesheet" href="profile.css">
</head>

<body>

<header>
    <button onclick="history.back()">←</button>
    <b>Profile</b>
    <button onclick="editProfile()">⚙️</button>
</header>

<main>

<section class="profile">
    <img id="avatar" src="assets/logo.png">
    
    <h2 id="username">CHUK USER</h2>
    <p id="bio">Selamat datang di CHUK AN CHUKK</p>

    <div class="stats">
        <div>
            <b id="postCount">0</b>
            <small>Postingan</small>
        </div>

        <div>
            <b id="followers">0</b>
            <small>Followers</small>
        </div>

        <div>
            <b id="following">0</b>
            <small>Following</small>
        </div>
    </div>

    <button class="edit" onclick="editProfile()">
        Edit Profil
    </button>
</section>

<h3>Postingan</h3>

<section id="myPosts" class="posts">
    <p>⏳ Memuat postingan...</p>
</section>

</main>

<nav>
    <button onclick="location.href='index.html'">
        🏠<small>Home</small>
    </button>

    <button onclick="location.href='post.html'">
        ＋<small>Post</small>
    </button>

    <button>
        👤<small>Profile</small>
    </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="profile.js"></script>

</body>
</html>
