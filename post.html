<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Buat Postingan - Chuk an Chukk</title>

<link rel="stylesheet" href="post.css">

<!-- PI SDK -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<style>

    .pi-login-box {
        padding: 12px 16px;
        margin: 10px 0 14px;
        border-radius: 14px;
        background: #f5f5f5;
        text-align: center;
    }

    #postPiLoginButton {
        border: 0;
        border-radius: 12px;
        padding: 10px 18px;
        background: #6b2cff;
        color: white;
        font-weight: 700;
        cursor: pointer;
    }

    #postPiLoginButton:disabled {
        opacity: .6;
    }

    #postPiStatus {
        margin-top: 7px;
        font-size: 12px;
        color: #666;
    }

</style>

</head>


<body>


<div class="upload-page">


    <!-- HEADER -->

    <header class="upload-header">

        <button
            class="back-btn"
            type="button"
            onclick="window.location.href='index.html'"
        >
            ←
        </button>


        <h2>
            Buat Postingan
        </h2>


        <button
            class="publish-btn"
            type="button"
            onclick="uploadPost()"
        >
            Posting
        </button>

    </header>


    <!-- PI LOGIN -->

    <div class="pi-login-box">

        <button
            id="postPiLoginButton"
            type="button"
        >
            🟣 Login with Pi
        </button>

        <div
            id="postPiStatus"
            aria-live="polite"
        >
            Belum login
        </div>

    </div>


    <!-- PREVIEW -->

    <div class="preview-box">

        <img
            id="preview"
            src="logo.png"
            alt="Preview"
        >

    </div>


    <!-- PILIH FILE -->

    <input
        type="file"
        id="mediaFile"
        accept="image/*,video/*"
        onchange="previewMedia(event)"
        hidden
    >


    <button
        class="choose-btn"
        type="button"
        onclick="document.getElementById('mediaFile').click()"
    >
        📷 Pilih Foto / Video
    </button>


    <!-- CAPTION -->

    <textarea
        id="caption"
        placeholder="Tulis caption postingan..."
    ></textarea>


    <!-- LOKASI -->

    <input
        type="text"
        id="location"
        class="input-box"
        placeholder="Lokasi (opsional)"
    >


    <!-- HASHTAG -->

    <input
        type="text"
        id="hashtags"
        class="input-box"
        placeholder="#hashtag"
    >


    <!-- PRIVACY -->

    <select
        id="privacy"
        class="input-box"
    >

        <option value="public">
            🌍 Publik
        </option>

        <option value="followers">
            👥 Followers
        </option>

        <option value="private">
            🔒 Private
        </option>

    </select>


    <!-- UPLOAD -->

    <button
        class="upload-btn"
        type="button"
        onclick="uploadPost()"
    >
        🚀 Upload Postingan
    </button>


</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<!-- POST JS -->

<script src="post.js"></script>


<script>

let postPiUser = null;


/* =====================================
   PI INIT
===================================== */

try {

    if (window.Pi) {

        window.Pi.init({
            version: "2.0",
            sandbox: false
        });

        console.log(
            "✅ Pi SDK POST siap"
        );

    } else {

        console.error(
            "❌ Pi SDK tidak ditemukan"
        );

    }

} catch (error) {

    console.error(
        "❌ Pi INIT ERROR:",
        error
    );

}


/* =====================================
   LOGIN PI UNTUK POST
===================================== */

async function loginPostWithPi() {

    const button =
        document.getElementById(
            "postPiLoginButton"
        );

    const status =
        document.getElementById(
            "postPiStatus"
        );

    try {

        button.disabled = true;

        status.textContent =
            "Menghubungkan ke Pi...";


        if (!window.Pi) {

            throw new Error(
                "Pi SDK tidak tersedia."
            );

        }


        console.log(
            "🟣 POST PI LOGIN..."
        );


        const auth =
            await window.Pi.authenticate(
                ["username"]
            );


        if (!auth || !auth.user) {

            throw new Error(
                "Data user Pi tidak ditemukan."
            );

        }


        postPiUser =
            auth.user;


        window.currentUser =
            auth.user;


        localStorage.setItem(
            "currentUser",
            JSON.stringify(
                auth.user
            )
        );


        status.textContent =
            "✅ Login sebagai @" +
            auth.user.username;


        button.textContent =
            "✅ @" +
            auth.user.username;


        console.log(
            "👤 POST PI USER:",
            auth.user
        );


    } catch (error) {

        console.error(
            "❌ POST PI LOGIN ERROR:",
            error
        );


        status.textContent =
            error.message ||
            "Login Pi gagal.";


        button.disabled = false;

    }

}


/* =====================================
   CEK SESSION PI
===================================== */

function restorePostPiUser() {

    try {

        const saved =
            localStorage.getItem(
                "currentUser"
            );


        if (!saved) return;


        const user =
            JSON.parse(saved);


        if (
            user &&
            user.username
        ) {

            postPiUser =
                user;

            window.currentUser =
                user;


            const status =
                document.getElementById(
                    "postPiStatus"
                );


            const button =
                document.getElementById(
                    "postPiLoginButton"
                );


            if (status) {

                status.textContent =
                    "✅ Login sebagai @" +
                    user.username;

            }


            if (button) {

                button.textContent =
                    "✅ @" +
                    user.username;

            }

        }

    } catch (error) {

        console.error(
            "❌ RESTORE PI ERROR:",
            error
        );

    }

}


/* =====================================
   START
===================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const button =
            document.getElementById(
                "postPiLoginButton"
            );


        if (button) {

            button.addEventListener(
                "click",
                loginPostWithPi
            );

        }


        restorePostPiUser();

    }
);

</script>


</body>

</html>
