<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Buat Postingan - Chuk an Chukk</title>

    <!-- PI SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="post.css">

    <style>

        .pi-login-box {
            margin: 14px 0;
            padding: 14px;
            border-radius: 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            text-align: center;
        }

        #piLoginButton {
            width: 100%;
            min-height: 48px;
            border: none;
            border-radius: 12px;
            background: #6b2cff;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        #piLoginButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #piLoginStatus {
            margin-top: 8px;
            font-size: 13px;
            color: #aaa;
        }

    </style>

</head>

<body>

<div class="upload-page">

    <!-- HEADER -->

    <header class="upload-header">

        <button
            class="back-btn"
            type="button"
            onclick="window.location.href='index.html'"
        >
            ←
        </button>

        <h2>Buat Postingan</h2>

        <button
            class="publish-btn"
            type="button"
            onclick="uploadPost()"
        >
            Posting
        </button>

    </header>


    <!-- LOGIN PI -->

    <div class="pi-login-box">

        <button
            id="piLoginButton"
            type="button"
            onclick="loginWithPi()"
        >
            🟣 Login with Pi
        </button>

        <div
            id="piLoginStatus"
            aria-live="polite"
        >
            Silakan login dengan Pi
        </div>

    </div>


    <!-- PREVIEW -->

    <div class="preview-box">

        <img
            id="preview"
            src="logo.png"
            alt="Preview"
        >

    </div>


    <!-- FILE -->

    <input
        type="file"
        id="mediaFile"
        accept="image/*,video/*"
        onchange="previewMedia(event)"
        hidden
    >


    <!-- PILIH MEDIA -->

    <button
        class="choose-btn"
        type="button"
        onclick="document.getElementById('mediaFile').click()"
    >
        📷 Pilih Foto / Video
    </button>


    <!-- CAPTION -->

    <textarea
        id="caption"
        placeholder="Tulis caption postingan..."
    ></textarea>


    <!-- LOCATION -->

    <input
        type="text"
        id="location"
        class="input-box"
        placeholder="Lokasi (opsional)"
    >


    <!-- HASHTAGS -->

    <input
        type="text"
        id="hashtags"
        class="input-box"
        placeholder="#hashtag"
    >


    <!-- PRIVACY -->

    <select
        id="privacy"
        class="input-box"
    >

        <option value="public">
            🌍 Publik
        </option>

        <option value="followers">
            👥 Followers
        </option>

        <option value="private">
            🔒 Private
        </option>

    </select>


    <!-- UPLOAD -->

    <button
        class="upload-btn"
        type="button"
        onclick="uploadPost()"
    >
        🚀 Upload Postingan
    </button>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<!-- POST SYSTEM -->

<script src="post.js"></script>


<!-- PI LOGIN SYSTEM -->
<!-- HARUS TERAKHIR -->

<script src="script.js"></script>


</body>

</html>
