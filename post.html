<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Buat Postingan - Chuk an Chukk</title>

<link rel="stylesheet" href="post.css">

<!-- PI SDK -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<style>

    .pi-login-box {
        margin: 10px 0 15px;
        padding: 12px;
        border-radius: 14px;
        background: #f5f5f5;
        text-align: center;
    }

    #piLoginButton {
        min-height: 42px;
        padding: 10px 18px;
        border: 0;
        border-radius: 12px;
        background: #6b2cff;
        color: white;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
    }

    #piLoginButton:disabled {
        opacity: .6;
        cursor: wait;
    }

    #piLoginStatus {
        margin-top: 7px;
        font-size: 12px;
        color: #666;
    }

</style>

</head>


<body>


<div class="upload-page">


    <!-- HEADER -->

    <header class="upload-header">

        <button
            class="back-btn"
            type="button"
            onclick="window.location.href='index.html'"
        >
            ←
        </button>


        <h2>
            Buat Postingan
        </h2>


        <button
            class="publish-btn"
            type="button"
            onclick="uploadPost()"
        >
            Posting
        </button>

    </header>


    <!-- =====================================
         LOGIN PI
    ====================================== -->

    <div class="pi-login-box">

        <button
            id="piLoginButton"
            type="button"
        >
            Login with Pi
        </button>


        <div
            id="piLoginStatus"
            aria-live="polite"
        >
            Silakan login dengan Pi
        </div>

    </div>


    <!-- PREVIEW -->

    <div class="preview-box">

        <img
            id="preview"
            src="logo.png"
            alt="Preview"
        >

    </div>


    <!-- PILIH FILE -->

    <input
        type="file"
        id="mediaFile"
        accept="image/*,video/*"
        onchange="previewMedia(event)"
        hidden
    >


    <button
        class="choose-btn"
        type="button"
        onclick="document.getElementById('mediaFile').click()"
    >
        📷 Pilih Foto / Video
    </button>


    <!-- CAPTION -->

    <textarea
        id="caption"
        placeholder="Tulis caption postingan..."
    ></textarea>


    <!-- LOKASI -->

    <input
        type="text"
        id="location"
        class="input-box"
        placeholder="Lokasi (opsional)"
    >


    <!-- HASHTAG -->

    <input
        type="text"
        id="hashtags"
        class="input-box"
        placeholder="#hashtag"
    >


    <!-- PRIVACY -->

    <select
        id="privacy"
        class="input-box"
    >

        <option value="public">
            🌍 Publik
        </option>

        <option value="followers">
            👥 Followers
        </option>

        <option value="private">
            🔒 Private
        </option>

    </select>


    <!-- UPLOAD -->

    <button
        class="upload-btn"
        type="button"
        onclick="uploadPost()"
    >
        🚀 Upload Postingan
    </button>


</div>


<!-- =====================================
     SUPABASE
====================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<!-- =====================================
     POST JS
====================================== -->

<script src="post.js"></script>


<!-- =====================================
     CHUK MAIN SCRIPT
     LOGIN PI YANG SAMA DENGAN INDEX
====================================== -->

<script src="script.js"></script>


</body>

</html>
