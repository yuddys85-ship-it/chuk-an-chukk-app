<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Buat Postingan - Chuk an Chukk</title>

    <link rel="stylesheet" href="post.css">

    <!-- PI SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

</head>

<body>

<div class="upload-page">

    <!-- HEADER -->

    <header class="upload-header">

        <button
            class="back-btn"
            type="button"
            onclick="window.location.href='index.html'"
        >
            ←
        </button>

        <h2>Buat Postingan</h2>

        <button
            class="publish-btn"
            type="button"
            onclick="uploadPost()"
        >
            Posting
        </button>

    </header>


    <!-- LOGIN PI -->

    <div class="pi-login-box">

        <button
            id="piLoginButton"
            type="button"
        >
            🟣 Login with Pi
        </button>

        <div
            id="piLoginStatus"
            aria-live="polite"
        >
            Menghubungkan ke Pi...
        </div>

    </div>


    <!-- PREVIEW -->

    <div class="preview-box">

        <img
            id="preview"
            src="logo.png"
            alt="Preview"
        >

    </div>


    <!-- FILE -->

    <input
        type="file"
        id="mediaFile"
        accept="image/*,video/*"
        onchange="previewMedia(event)"
        hidden
    >


    <button
        class="choose-btn"
        type="button"
        onclick="document.getElementById('mediaFile').click()"
    >
        📷 Pilih Foto / Video
    </button>


    <textarea
        id="caption"
        placeholder="Tulis caption postingan..."
    ></textarea>


    <input
        type="text"
        id="location"
        class="input-box"
        placeholder="Lokasi (opsional)"
    >


    <input
        type="text"
        id="hashtags"
        class="input-box"
        placeholder="#hashtag"
    >


    <select
        id="privacy"
        class="input-box"
    >

        <option value="public">
            🌍 Publik
        </option>

        <option value="followers">
            👥 Followers
        </option>

        <option value="private">
            🔒 Private
        </option>

    </select>


    <button
        class="upload-btn"
        type="button"
        onclick="uploadPost()"
    >
        🚀 Upload Postingan
    </button>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<!-- POST -->

<script src="post.js"></script>


<!-- PI LOGIN -->
<script>

(function () {

    const status =
        document.getElementById("piLoginStatus");

    const button =
        document.getElementById("piLoginButton");


    function setStatus(message) {

        if (status) {
            status.textContent = message;
        }

    }


    function initPiPost() {

        console.log("🔵 POST: cek Pi SDK");

        if (typeof window.Pi === "undefined") {

            console.error(
                "❌ POST: Pi SDK tidak tersedia"
            );

            setStatus(
                "❌ Pi SDK tidak tersedia. Buka halaman ini melalui Pi Browser."
            );

            return;

        }


        try {

            window.Pi.init({
                version: "2.0",
                sandbox: false
            });

            console.log(
                "🟢 POST: Pi SDK berhasil di-init"
            );

            setStatus(
                "🟢 Pi siap. Silakan login."
            );

        } catch (error) {

            console.error(
                "❌ POST: Pi init error",
                error
            );

            setStatus(
                "❌ Pi gagal diinisialisasi."
            );

        }

    }


    async function loginPostPi() {

        console.log(
            "🔵 POST: Login with Pi ditekan"
        );


        if (typeof window.Pi === "undefined") {

            setStatus(
                "❌ Pi SDK tidak tersedia."
            );

            return;

        }


        button.disabled = true;

        setStatus(
            "🔄 Menghubungkan ke Pi..."
        );


        try {

            const auth =
                await window.Pi.authenticate(
                    ["username"]
                );


            console.log(
                "🟢 POST: Login Pi berhasil",
                auth
            );


            if (
                !auth ||
                !auth.user
            ) {

                throw new Error(
                    "Data pengguna Pi tidak ditemukan."
                );

            }


            window.currentUser =
                auth.user;


            window.piLoginUser =
                auth.user;


            localStorage.setItem(
                "currentUser",
                JSON.stringify(
                    auth.user
                )
            );


            setStatus(
                "✅ Login berhasil sebagai @" +
                auth.user.username
            );


            button.textContent =
                "✅ @" +
                auth.user.username;


        } catch (error) {

            console.error(
                "❌ POST LOGIN ERROR:",
                error
            );


            setStatus(
                "❌ " +
                (
                    error.message ||
                    "Login Pi gagal."
                )
            );


            button.disabled = false;

        }

    }


    if (button) {

        button.addEventListener(
            "click",
            loginPostPi
        );

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initPiPost
        );

    } else {

        initPiPost();

    }

})();

</script>

</body>

</html>
