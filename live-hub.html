<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Chuk an Chukk — Live</title>

    <link rel="stylesheet" href="live-hub.css">
</head>

<body>

    <main id="liveHub" class="live-hub">

        <!-- =====================================================
             HALAMAN 1 — LIVE FEED
             TIDAK MENGAKSES KAMERA
        ====================================================== -->
        <section
            id="liveFeedPage"
            class="hub-page live-feed-page"
        >

            <header class="live-feed-header">
                <div>
                    <div class="brand-title">
                        CHUK AN CHUKK
                    </div>

                    <div class="brand-subtitle">
                        LIVE
                    </div>
                </div>

                <button
                    id="startLiveButton"
                    class="start-live-button"
                    type="button"
                >
                    LIVE
                </button>
            </header>

            <div
                id="liveFeed"
                class="live-feed"
            >

                <div
                    id="liveLoading"
                    class="live-status"
                >
                    Memuat LIVE...
                </div>

            </div>

            <div class="swipe-hint">
                Geser ke kiri untuk LIVE
            </div>

        </section>


        <!-- =====================================================
             HALAMAN 2 — LIVE VIEWER
        ====================================================== -->
        <section
            id="liveViewerPage"
            class="hub-page live-viewer-page"
        >

            <div
                id="viewerContainer"
                class="viewer-container"
            >

                <div class="viewer-placeholder">

                    <div class="viewer-icon">
                        LIVE
                    </div>

                    <div
                        id="viewerTitle"
                        class="viewer-title"
                    >
                        Pilih LIVE
                    </div>

                    <div
                        id="viewerRoom"
                        class="viewer-room"
                    >
                        Belum ada room
                    </div>

                    <button
                        id="openViewerButton"
                        class="open-viewer-button"
                        type="button"
                    >
                        Buka LIVE
                    </button>

                </div>

            </div>

            <button
                id="backToFeedButton"
                class="back-to-feed-button"
                type="button"
                aria-label="Kembali ke daftar LIVE"
            >
                ‹
            </button>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="live-hub.js"></script>

</body>
</html>
