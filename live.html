<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#000000">

    <meta name="mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>CHUK AN CHUKK — Live</title>

    <link rel="stylesheet" href="live.css">

</head>


<body>

<div id="liveApp" class="live-app">


    <!-- =====================================================
         CAMERA
         ===================================================== -->

    <video
        id="camera"
        class="camera-source"
        autoplay
        muted
        playsinline
        webkit-playsinline
        preload="none"
    ></video>


    <!-- Camera rendering canvas -->
    <canvas id="filterCanvas"></canvas>


    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header class="live-header">

        <button
            id="closeLiveButton"
            class="header-button"
            type="button"
            aria-label="Tutup Live"
            title="Tutup"
        >
            ✕
        </button>


        <div class="live-title">

            <span class="live-dot"></span>

            <span>LIVE</span>

        </div>


        <div class="viewer-box">

            <span class="viewer-icon">👁</span>

            <span id="viewerCount">0</span>

        </div>

    </header>


    <!-- =====================================================
         CAMERA STATUS
         ===================================================== -->

    <div
        id="cameraStatus"
        class="camera-status"
    >
        Menyiapkan kamera...
    </div>


    <!-- =====================================================
         HOST
         ===================================================== -->

    <section class="host-info">

        <div class="host-avatar">
            <span>👤</span>
        </div>


        <div class="host-details">

            <strong id="hostName">
                Chuk an Chukk
            </strong>

            <span id="hostUsername">
                @chukanchukk
            </span>

        </div>


        <button
            id="followButton"
            class="follow-button"
            type="button"
        >
            Follow
        </button>

    </section>


    <!-- =====================================================
         DESCRIPTION
         ===================================================== -->

    <div class="live-description">

        <span id="liveDescription">
            Selamat datang di Chuk an Chukk Live 🔥
        </span>

    </div>


    <!-- =====================================================
         COMMENTS
         ===================================================== -->

    <section
        id="commentsContainer"
        class="comments-container"
        aria-label="Komentar Live"
    >

        <div
            id="commentsList"
            class="comments-list"
        ></div>

    </section>


    <!-- =====================================================
         LIKE
         ===================================================== -->

    <div class="like-area">

        <button
            id="likeButton"
            class="side-button like-button"
            type="button"
            aria-label="Like"
            title="Like"
        >

            <span class="side-icon">
                ❤️
            </span>

            <span id="likeCount">
                0
            </span>

        </button>

    </div>


    <!-- =====================================================
         SIDE CONTROLS
         ===================================================== -->

    <aside class="side-controls">


        <!-- COMMENT -->

        <button
            id="commentButton"
            class="side-button"
            type="button"
            aria-label="Komentar"
            title="Komentar"
        >

            <span class="side-icon">
                💬
            </span>

            <span>
                Chat
            </span>

        </button>


        <!-- FLIP -->

        <button
            id="flipButton"
            class="side-button"
            type="button"
            aria-label="Balik Kamera"
            title="Balik Kamera"
        >

            <span class="side-icon">
                🔄
            </span>

            <span>
                Flip
            </span>

        </button>


        <!-- CAMERA -->

        <button
            id="cameraButton"
            class="side-button"
            type="button"
            aria-label="Kamera"
            title="Kamera"
        >

            <span
                id="cameraIcon"
                class="side-icon"
            >
                📷
            </span>

            <span id="cameraText">
                Camera
            </span>

        </button>


        <!-- MICROPHONE -->

        <button
            id="micButton"
            class="side-button"
            type="button"
            aria-label="Microphone"
            title="Microphone"
        >

            <span
                id="micIcon"
                class="side-icon"
            >
                🎤
            </span>

            <span id="micText">
                Mic
            </span>

        </button>


        <!-- FILTER BUTTON
             Hanya tombol sementara.
             Mesin filter sudah dihapus.
        -->

        <button
            id="filterButton"
            class="side-button filter-button"
            type="button"
            aria-label="Filter"
            title="Filter sementara dinonaktifkan"
        >

            <span class="side-icon">
                ✨
            </span>

            <span>
                Filter
            </span>

        </button>

    </aside>


    <!-- =====================================================
         COMMENT INPUT
         ===================================================== -->

    <section
        id="commentInputArea"
        class="comment-input-area"
    >

        <input
            id="commentInput"
            type="text"
            maxlength="150"
            autocomplete="off"
            placeholder="Tulis komentar..."
        >


        <button
            id="sendCommentButton"
            type="button"
            aria-label="Kirim komentar"
        >
            ➤
        </button>

    </section>


    <!-- =====================================================
         BOTTOM CONTROLS
         ===================================================== -->

    <footer class="live-controls">


        <!-- MIC -->

        <button
            id="bottomMicButton"
            class="bottom-control"
            type="button"
            aria-label="Microphone"
        >

            🎤

            <span>
                Mic
            </span>

        </button>


        <!-- FILTER -->

        <button
            id="bottomFilterButton"
            class="bottom-control"
            type="button"
            aria-label="Filter"
            title="Filter sementara dinonaktifkan"
        >

            ✨

            <span>
                Filter
            </span>

        </button>


        <!-- START LIVE -->

        <button
            id="startLiveButton"
            class="start-live-button"
            type="button"
        >

            🔴

            <span id="startLiveText">
                Mulai Live
            </span>

        </button>


        <!-- FLIP -->

        <button
            id="bottomFlipButton"
            class="bottom-control"
            type="button"
            aria-label="Flip Kamera"
        >

            🔄

            <span>
                Flip
            </span>

        </button>

    </footer>


    <!-- =====================================================
         TIMER
         ===================================================== -->

    <div
        id="liveTimer"
        class="live-timer"
    >
        00:00
    </div>


    <!-- =====================================================
         LIGHT STATUS
         ===================================================== -->

    <div
        id="lightStatus"
        class="light-status"
    >
        💡 Camera Ready
    </div>


</div>


<!-- =====================================================
     ONLY LIVE CONTROLLER
     ===================================================== -->

<script src="live.js"></script>


</body>

</html>
