<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>CHUK AN CHUKK — Live</title>

    <link
        rel="stylesheet"
        href="live.css"
    >

</head>

<body>

<div
    id="liveApp"
    class="live-app"
>

    <!-- =================================================
         KAMERA
         ================================================= -->

    <video
        id="camera"
        class="camera-source"
        autoplay
        muted
        playsinline
        webkit-playsinline
    ></video>


    <!-- =================================================
         MENU
         ================================================= -->

    <button
        id="menuButton"
        class="menu-button"
        type="button"
        aria-label="Menu"
    >
        ☰
    </button>


    <!-- =================================================
         PINDAH KAMERA
         ================================================= -->

    <button
        id="flipCameraButton"
        class="flip-camera-button"
        type="button"
        aria-label="Pindah kamera"
    >
        ↻
    </button>


    <!-- =================================================
         SHARE
         ================================================= -->

    <button
        id="shareLiveButton"
        class="share-live-button"
        type="button"
        aria-label="Bagikan Live"
    >

        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <circle
                cx="18"
                cy="5"
                r="2.5"
            ></circle>

            <circle
                cx="6"
                cy="12"
                r="2.5"
            ></circle>

            <circle
                cx="18"
                cy="19"
                r="2.5"
            ></circle>

            <line
                x1="8.2"
                y1="10.8"
                x2="15.8"
                y2="6.2"
            ></line>

            <line
                x1="8.2"
                y1="13.2"
                x2="15.8"
                y2="17.8"
            ></line>

        </svg>

    </button>


    <!-- =================================================
         TOMBOL KOMENTAR
         ================================================= -->

    <button
        id="liveCommentButton"
        class="live-comment-button"
        type="button"
        aria-label="Komentar"
    >
        💬
    </button>


    <!-- =================================================
         PANEL KOMENTAR
         ================================================= -->

    <div
        id="liveCommentPanel"
        class="live-comment-panel"
        hidden
    >

        <!-- HEADER -->

        <div
            class="live-comment-header"
        >

            <strong>
                Komentar Live
            </strong>

            <button
                id="closeLiveComments"
                type="button"
                aria-label="Tutup komentar"
            >
                ✕
            </button>

        </div>


        <!-- DAFTAR KOMENTAR -->

        <div
            id="liveCommentsList"
            class="live-comments-list"
        >
        </div>


        <!-- INPUT KOMENTAR -->

        <form
            id="liveCommentForm"
            class="live-comment-form"
        >

            <input
                id="liveCommentInput"
                type="text"
                maxlength="200"
                placeholder="Tambahkan komentar..."
                autocomplete="off"
            >

            <button
                type="submit"
                aria-label="Kirim komentar"
            >
                ➤
            </button>

        </form>

    </div>

</div>


<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script src="live.js"></script>

<script src="live-menu.js"></script>

<script src="live-share.js"></script>

<script src="live-comments.js"></script>


</body>

</html>
