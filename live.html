<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Chuk an Chukk — Live</title>

    <link rel="stylesheet" href="live.css">

</head>

<body>

<div class="live-app" id="liveApp">

    <!-- =====================================================
         CAMERA
    ====================================================== -->

    <video
        id="camera"
        autoplay
        muted
        playsinline
        webkit-playsinline
    ></video>

    <canvas id="filterCanvas"></canvas>


    <!-- =====================================================
         PROFILE HOST
    ====================================================== -->

    <div id="liveUserDisplay">

        <img
            id="liveUserAvatar"
            src="assets/logo.png"
            alt="Profile"
        >

        <span id="liveUserName">
            Chuk User
        </span>

        <button
            id="followHostButton"
            class="follow-host-button"
            type="button"
        >
            + Ikuti
        </button>

    </div>


    <!-- =====================================================
         JUMLAH PENONTON
    ====================================================== -->

    <div
        id="liveViewerCount"
        class="live-viewer-count"
    >

        <span class="viewer-icon">👁</span>

        <span id="viewerCountNumber">
            0
        </span>

    </div>


    <!-- =====================================================
         ROOM ID
    ====================================================== -->

    <div id="liveRoomDisplay">
        CHUK-XXXXXX
    </div>


    <!-- =====================================================
         FLIP CAMERA
    ====================================================== -->

    <button
        class="flip-camera-button"
        id="flipCameraButton"
        type="button"
        aria-label="Balik kamera"
    >
        🔄
    </button>


    <!-- =====================================================
         MENU
    ====================================================== -->

    <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Menu"
        aria-expanded="false"
    >
        ☰
    </button>


    <!-- =====================================================
         ROOM / LIVE MENU PANEL
    ====================================================== -->

    <div id="roomPanel" hidden>

    <button type="button" class="live-menu-item" id="openFilterMenu">
        <span>🎨</span>
        <span>Filter</span>
    </button>

    <button type="button" class="live-menu-item" id="openRoomNameMenu">
        <span>✏️</span>
        <span>Nama Room</span>
    </button>

    <button type="button" class="live-menu-item" id="publicRoomMenu">
        <span>🌐</span>
        <span>Publik</span>
    </button>

    <button type="button" class="live-menu-item" id="privateRoomMenu">
        <span>🔒</span>
        <span>Privat</span>
    </button>

</div>


    <!-- =====================================================
         FILTER KAMERA
    ====================================================== -->

    <div
        id="liveFilterPanel"
        class="live-filter-panel"
    >

        <button
            type="button"
            class="filter-option active"
            data-filter="none"
        >
            <span class="filter-preview normal"></span>
            <span>Normal</span>
        </button>

        <button
            type="button"
            class="filter-option"
            data-filter="warm"
        >
            <span class="filter-preview warm"></span>
            <span>Warm</span>
        </button>

        <button
            type="button"
            class="filter-option"
            data-filter="cool"
        >
            <span class="filter-preview cool"></span>
            <span>Cool</span>
        </button>

        <button
            type="button"
            class="filter-option"
            data-filter="gray"
        >
            <span class="filter-preview gray"></span>
            <span>Classic</span>
        </button>

        <button
            type="button"
            class="filter-option"
            data-filter="bright"
        >
            <span class="filter-preview bright"></span>
            <span>Bright</span>
        </button>

        <button
            type="button"
            class="filter-option"
            data-filter="soft"
        >
            <span class="filter-preview soft"></span>
            <span>Soft</span>
        </button>

    </div>

    ✨ Beauty Filter — istilah umum.
💎 Skin Smooth — menghaluskan kulit.
🌸 Youth/Youthful — memberi tampilan lebih muda.


    <!-- =====================================================
         COMMENT BUTTON
         HIDDEN — UNTUK KOMPATIBILITAS JS
    ====================================================== -->

    <button
        class="live-comment-button"
        id="liveCommentButton"
        type="button"
        aria-label="Komentar"
        hidden
    >
        💬
    </button>

    <!-- COMMENT BUTTON HIDDEN -->
<button
    class="live-comment-button"
    id="liveCommentButton"
    type="button"
    aria-label="Komentar"
    hidden
>
    💬
</button>

<!-- LIVE CONTROL -->
<div id="liveControl">

    <!-- MULAI LIVE -->
    <button
        id="startLiveButton"
        class="live-control-button start-live"
        type="button"
        aria-label="Mulai Live"
    >
        <span class="live-control-icon">🔴</span>
        <span class="live-control-text">Mulai Live</span>
    </button>

    <!-- STOP LIVE -->
    <button
        id="stopLiveButton"
        class="live-control-button stop-live"
        type="button"
        aria-label="Stop Live"
        hidden
    >
        <span class="live-control-icon">⏹️</span>
        <span class="live-control-text">Stop Live</span>
    </button>

</div>

<!-- SHARE LIVE -->
<button
    id="shareLiveButton"
    class="share-live-button"
    type="button"
    aria-label="Bagikan Live"
>


    <!-- =====================================================
         SHARE LIVE
    ====================================================== -->

    <button
        class="share-live-button"
        id="shareLiveButton"
        type="button"
        aria-label="Bagikan Live"
    >

        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <path d="M12 16V3"></path>

            <path d="M7 8l5-5 5 5"></path>

            <path
                d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"
            ></path>

        </svg>

    </button>


    <!-- =====================================================
         LIVE MESSAGE
    ====================================================== -->

    <section
        class="live-comment-panel"
        id="liveCommentPanel"
    >

        <div
            class="live-comments-list"
            id="liveCommentsList"
        ></div>


        <form
            class="live-comment-form"
            id="liveCommentForm"
        >

            <textarea
                id="liveCommentInput"
                rows="1"
                placeholder="Tulis pesan..."
                autocomplete="off"
                maxlength="300"
            ></textarea>

            <button
                type="submit"
                aria-label="Kirim pesan"
            >
                ➤
            </button>

        </form>

    </section>

</div>

    <!-- =========================================================
     SUPABASE
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =========================================================
     CHUK AN CHUKK LIVE SCRIPTS
========================================================= -->

<script src="live.js"></script>

<script src="live-filter.js"></script>
<script src="live-filter-menu.js"></script>

<script src="live-stream.js"></script>

<script src="live-menu.js"></script>
<script src="live-room-name.js"></script>
<script src="live-public.js"></script>
<script src="live-private.js"></script>

<script src="live-share.js"></script>
<script src="live-comments.js"></script>

</body>
</html>
