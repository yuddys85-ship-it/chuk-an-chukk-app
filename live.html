<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#000000">

    <title>CHUK AN CHUKK - LIVE</title>

    <link rel="stylesheet" href="live.css">
</head>

<body>

<div class="live-app">

    <!-- HEADER -->
    <header class="live-header">

        <button
            id="closeLive"
            class="header-button"
            type="button"
            aria-label="Tutup Live"
        >
            ✕
        </button>

        <div class="live-title">
            <span class="live-dot"></span>
            <strong>LIVE</strong>
        </div>

        <div class="viewer-count">
            👁️ <span id="viewerCount">0</span>
        </div>

    </header>


    <!-- CAMERA -->
    <main class="camera-area">

        <video
            id="camera"
            autoplay
            muted
            playsinline
            webkit-playsinline
        ></video>

        <!--
            Canvas hanya muncul ketika filter aktif.
            Jadi kalau filter error, kamera tetap terlihat.
        -->
        <canvas id="filterCanvas"></canvas>


        <!-- CAMERA STATUS -->
        <div id="cameraStatus" class="camera-status">
            📷 Menyiapkan kamera...
        </div>


        <!-- LIGHT STATUS -->
        <div id="lightStatus" class="light-status">
            ☀️ AUTO LIGHT
        </div>


        <!-- LIVE INFO -->
        <div class="live-info">

            <div class="host-info">

                <img
                    src="assets/logo.png"
                    alt="Host"
                >

                <div>
                    <strong>CHUK USER</strong>
                    <small id="liveTime">00:00</small>
                </div>

            </div>


            <div class="like-area">

                <button
                    id="likeButton"
                    type="button"
                    aria-label="Like"
                >
                    ❤️
                </button>

                <span id="likeCount">0</span>

            </div>

        </div>

    </main>


    <!-- FILTER PANEL -->
    <section
        id="filterPanel"
        class="filter-panel"
    >

        <div class="panel-title">

            <div>
                <strong>✨ Dream Like</strong>
                <small>Plastic 90%</small>
            </div>

            <button
                id="resetFilter"
                type="button"
            >
                Reset
            </button>

        </div>


        <!-- MAIN FILTER -->
        <div class="dream-filter-main">

            <button
                id="dreamLikeButton"
                class="dream-main-button active"
                type="button"
            >

                <span>✨</span>

                <strong>DREAM LIKE</strong>

                <small>PLASTIC 90%</small>

            </button>

        </div>


        <!-- BEAUTY CONTROLS -->
        <div class="beauty-controls">

            <label>

                <div>
                    <span>🧴 Plastic Skin</span>
                    <b id="plasticValue">90%</b>
                </div>

                <input
                    id="plasticRange"
                    type="range"
                    min="0"
                    max="100"
                    value="90"
                >

            </label>


            <label>

                <div>
                    <span>✨ Dream Glow</span>
                    <b id="glowValue">65%</b>
                </div>

                <input
                    id="glowRange"
                    type="range"
                    min="0"
                    max="100"
                    value="65"
                >

            </label>


            <label>

                <div>
                    <span>💎 Brightness</span>
                    <b id="brightnessValue">35%</b>
                </div>

                <input
                    id="brightnessRange"
                    type="range"
                    min="0"
                    max="100"
                    value="35"
                >

            </label>


            <label>

                <div>
                    <span>🌸 Soft Focus</span>
                    <b id="softFocusValue">55%</b>
                </div>

                <input
                    id="softFocusRange"
                    type="range"
                    min="0"
                    max="100"
                    value="55"
                >

            </label>


            <label>

                <div>
                    <span>👀 Face Detail</span>
                    <b id="detailValue">25%</b>
                </div>

                <input
                    id="detailRange"
                    type="range"
                    min="0"
                    max="100"
                    value="25"
                >

            </label>

        </div>


        <!-- AUTO LIGHT -->
        <div class="auto-light-control">

            <div>

                <span>☀️🌙 Auto Siang / Malam</span>

                <small id="autoLightText">
                    Aktif — menyesuaikan cahaya otomatis
                </small>

            </div>

            <button
                id="autoLightButton"
                class="toggle active"
                type="button"
                aria-label="Auto Light"
            >
                <span></span>
            </button>

        </div>

    </section>


    <!-- BOTTOM CONTROLS -->
    <footer class="live-controls">

        <button
            id="cameraButton"
            type="button"
        >
            📹
            <small>Kamera</small>
        </button>


        <button
            id="micButton"
            type="button"
        >
            🎤
            <small>Mic</small>
        </button>


        <button
            id="startLiveButton"
            class="start-live"
            type="button"
        >
            🔴
            <small>Mulai Live</small>
        </button>


        <button
            id="flipButton"
            type="button"
        >
            🔄
            <small>Flip</small>
        </button>


        <button
            id="filterButton"
            type="button"
        >
            ✨
            <small>Filter</small>
        </button>

    </footer>

</div>


<!-- FILTER JS -->
<script src="dream-like-filter.js"></script>

<!-- LIVE JS -->
<script src="live.js"></script>

</body>
</html>
