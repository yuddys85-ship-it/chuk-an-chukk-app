<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Chuk an Chukk — Live</title>

    <link rel="stylesheet" href="live.css">
</head>

<body>

<div class="live-app" id="liveApp">

    <!-- =====================================================
         CAMERA
         ===================================================== -->

    <video
        id="camera"
        autoplay
        muted
        playsinline
        webkit-playsinline
    ></video>

    <!-- Canvas untuk filter / efek kamera -->
    <canvas id="filterCanvas"></canvas>


    <!-- =====================================================
         PROFILE HOST
         ===================================================== -->

<div id="liveUserDisplay">
    <img id="liveUserAvatar" src="assets/logo.png" alt="Profile">
    <span id="liveUserName">Chuk User</span>

    <button
        id="followHostButton"
        class="follow-host-button"
        type="button"
    >
        + Ikuti
    </button>
</div>
    
<!-- JUMLAH PENONTON LIVE -->
    
<div
    id="liveViewerCount"
    class="live-viewer-count"
>
    <span class="viewer-icon">👁</span>
    <span id="viewerCountNumber">0</span>
</div>
    

    <!-- =====================================================
         ROOM
         ===================================================== -->

    <div id="liveRoomDisplay">
        CHUK-XXXXXX
    </div>


    <!-- =====================================================
         FLIP CAMERA
         ===================================================== -->

    <button
        class="flip-camera-button"
        id="flipCameraButton"
        type="button"
        aria-label="Balik kamera"
    >
        🔄
    </button>


    <!-- =====================================================
         MENU
         ===================================================== -->

    <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Menu"
    >
        ☰
    </button>


    <!-- =====================================================
         ROOM PANEL
         ===================================================== -->

    <div id="roomPanel" hidden>

        <div class="room-name-label">
            Nama Room
        </div>

        <input
            class="room-name-input"
            id="roomNameInput"
            type="text"
            placeholder="Masukkan nama room"
            maxlength="40"
        >

        <div class="room-title">
            Live Room
        </div>

        <div class="room-live">
            CHUK-XXXXXX
        </div>

        <div class="room-subtitle">
            Pilih jumlah penonton
        </div>

        <div class="room-options">

            <button
                class="room-option selected"
                type="button"
            >
                4
            </button>

            <button
                class="room-option"
                type="button"
            >
                10
            </button>

            <button
                class="room-option"
                type="button"
            >
                50
            </button>

            <button
                class="room-option"
                type="button"
            >
                ∞
            </button>

        </div>

    </div>


    <!-- =====================================================
         COMMENT BUTTON
         DISIMPAN UNTUK KOMPATIBILITAS JAVASCRIPT
         TAPI TIDAK DITAMPILKAN
         ===================================================== -->

    <button
        class="live-comment-button"
        id="liveCommentButton"
        type="button"
        aria-label="Komentar"
        hidden
    >
        💬
    </button>


    <!-- =====================================================
         SHARE LIVE
         ===================================================== -->

    <button
        class="share-live-button"
        id="shareLiveButton"
        type="button"
        aria-label="Bagikan Live"
    >

        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <path d="M12 16V3"></path>

            <path d="M7 8l5-5 5 5"></path>

            <path
                d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"
            ></path>

        </svg>

    </button>


    <!-- =====================================================
         LIVE MESSAGE
         TANPA HEADER KOMENTAR
         TANPA PANEL POPUP
         ===================================================== -->

    <section
        class="live-comment-panel"
        id="liveCommentPanel"
    >

        <!-- =================================================
             MESSAGE LIST
             ================================================= -->

        <div
            class="live-comments-list"
            id="liveCommentsList"
        ></div>


        <!-- =================================================
             MESSAGE INPUT
             ================================================= -->

        <form
            class="live-comment-form"
            id="liveCommentForm"
        >

            <textarea
                id="liveCommentInput"
                rows="1"
                placeholder="Tulis pesan..."
                autocomplete="off"
                maxlength="300"
            ></textarea>

            <button
                type="submit"
                aria-label="Kirim pesan"
            >
                ➤
            </button>

        </form>

    </section>

</div>


<!-- =========================================================
     SUPABASE
     ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =========================================================
     CHUK AN CHUKK LIVE SCRIPTS
     ========================================================= -->

<script src="live.js"></script>

<script src="live-stream.js"></script>

<script src="live-menu.js"></script>

<script src="live-share.js"></script>

<script src="live-comments.js"></script>


</body>
</html>
