<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>CHUK AN CHUKK — Live</title>

    <link rel="stylesheet" href="live.css">
</head>

<body>

<div id="liveApp" class="live-app">

    <!-- =====================================================
         CAMERA SOURCE
         Video hanya sebagai sumber kamera.
         Tampilan utama dirender oleh filterCanvas.
         ===================================================== -->

    <video
        id="camera"
        class="camera-source"
        autoplay
        muted
        playsinline
        webkit-playsinline
        preload="none"
    ></video>

    <!-- Canvas utama kamera -->
    <canvas id="filterCanvas"></canvas>


    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header class="live-header">

        <button
            id="closeLiveButton"
            class="header-button"
            type="button"
            aria-label="Tutup Live"
            title="Tutup"
        >
            ✕
        </button>

        <div class="live-title">
            <span class="live-dot"></span>
            <span>LIVE</span>
        </div>

        <div class="viewer-box">
            <span class="viewer-icon">👁</span>
            <span id="viewerCount">0</span>
        </div>

    </header>


    <!-- =====================================================
         CAMERA STATUS
         ===================================================== -->

    <div id="cameraStatus" class="camera-status">
        Menyiapkan kamera...
    </div>


    <!-- =====================================================
         HOST INFORMATION
         ===================================================== -->

    <section class="host-info">

        <div class="host-avatar">
            <span>👤</span>
        </div>

        <div class="host-details">

            <strong id="hostName">
                Chuk an Chukk
            </strong>

            <span id="hostUsername">
                @chukanchukk
            </span>

        </div>

        <button
            id="followButton"
            class="follow-button"
            type="button"
        >
            Follow
        </button>

    </section>


    <!-- =====================================================
         LIVE DESCRIPTION
         ===================================================== -->

    <div class="live-description">
        <span id="liveDescription">
            Selamat datang di Chuk an Chukk Live 🔥
        </span>
    </div>


    <!-- =====================================================
         COMMENTS
         ===================================================== -->

    <section
        id="commentsContainer"
        class="comments-container"
        aria-label="Komentar Live"
    >

        <div
            id="commentsList"
            class="comments-list"
        ></div>

    </section>


    <!-- =====================================================
         LIKE
         ===================================================== -->

    <div class="like-area">

        <button
            id="likeButton"
            class="side-button like-button"
            type="button"
            aria-label="Like"
            title="Like"
        >
            <span class="side-icon">❤️</span>
            <span id="likeCount">0</span>
        </button>

    </div>


    <!-- =====================================================
         RIGHT SIDE CONTROLS
         ===================================================== -->

    <aside class="side-controls">

        <button
            id="commentButton"
            class="side-button"
            type="button"
            aria-label="Komentar"
            title="Komentar"
        >
            <span class="side-icon">💬</span>
            <span>Chat</span>
        </button>


        <button
            id="flipButton"
            class="side-button"
            type="button"
            aria-label="Balik Kamera"
            title="Balik Kamera"
        >
            <span class="side-icon">🔄</span>
            <span>Flip</span>
        </button>


        <button
            id="cameraButton"
            class="side-button"
            type="button"
            aria-label="Kamera"
            title="Kamera"
        >
            <span
                id="cameraIcon"
                class="side-icon"
            >
                📷
            </span>

            <span id="cameraText">
                Camera
            </span>
        </button>


        <button
            id="micButton"
            class="side-button"
            type="button"
            aria-label="Microphone"
            title="Microphone"
        >
            <span
                id="micIcon"
                class="side-icon"
            >
                🎤
            </span>

            <span id="micText">
                Mic
            </span>
        </button>


        <button
            id="filterButton"
            class="side-button filter-button"
            type="button"
            aria-label="Filter"
            title="Filter wajah"
        >
            <span class="side-icon">✨</span>
            <span>Filter</span>
        </button>

    </aside>


    <!-- =====================================================
         BEAUTY FILTER PANEL
         Filter sekarang ditangani langsung oleh live.js
         ===================================================== -->

    <section
        id="filterPanel"
        class="filter-panel"
        aria-label="Pengaturan Filter"
    >

        <div class="filter-panel-header">

            <div>
                <strong>✨ Beauty Filter</strong>

                <small>
                    Dream Like
                </small>
            </div>

            <button
                id="closeFilterButton"
                type="button"
                class="panel-close"
                aria-label="Tutup Filter"
            >
                ✕
            </button>

        </div>


        <!-- Preset -->
        <button
            id="dreamLikeButton"
            class="dream-filter-button"
            type="button"
        >
            ✨ Dream Like
        </button>


        <!-- Plastic -->
        <div class="filter-control">

            <div class="filter-label">
                <span>Plastic</span>
                <span id="plasticValue">90</span>
            </div>

            <input
                id="plasticSlider"
                type="range"
                min="0"
                max="100"
                value="90"
            >

        </div>


        <!-- Glow -->
        <div class="filter-control">

            <div class="filter-label">
                <span>Glow</span>
                <span id="glowValue">65</span>
            </div>

            <input
                id="glowSlider"
                type="range"
                min="0"
                max="100"
                value="65"
            >

        </div>


        <!-- Brightness -->
        <div class="filter-control">

            <div class="filter-label">
                <span>Brightness</span>
                <span id="brightnessValue">35</span>
            </div>

            <input
                id="brightnessSlider"
                type="range"
                min="0"
                max="100"
                value="35"
            >

        </div>


        <!-- Soft Focus -->
        <div class="filter-control">

            <div class="filter-label">
                <span>Soft Focus</span>
                <span id="softFocusValue">55</span>
            </div>

            <input
                id="softFocusSlider"
                type="range"
                min="0"
                max="100"
                value="55"
            >

        </div>


        <!-- Detail -->
        <div class="filter-control">

            <div class="filter-label">
                <span>Detail</span>
                <span id="detailValue">25</span>
            </div>

            <input
                id="detailSlider"
                type="range"
                min="0"
                max="100"
                value="25"
            >

        </div>


        <!-- Auto Light -->
        <div class="filter-option">

            <div>
                <strong>💡 Auto Light</strong>

                <small>
                    Sesuaikan pencahayaan otomatis
                </small>
            </div>

            <button
                id="autoLightButton"
                class="toggle-button active"
                type="button"
                aria-pressed="true"
            >
                ON
            </button>

        </div>

    </section>


    <!-- =====================================================
         COMMENT INPUT
         ===================================================== -->

    <section
        id="commentInputArea"
        class="comment-input-area"
    >

        <input
            id="commentInput"
            type="text"
            maxlength="150"
            autocomplete="off"
            placeholder="Tulis komentar..."
        >

        <button
            id="sendCommentButton"
            type="button"
            aria-label="Kirim komentar"
        >
            ➤
        </button>

    </section>


    <!-- =====================================================
         BOTTOM LIVE CONTROLS
         ===================================================== -->

    <footer class="live-controls">

        <button
            id="bottomMicButton"
            class="bottom-control"
            type="button"
            aria-label="Microphone"
        >
            🎤
            <span>Mic</span>
        </button>


        <button
            id="bottomFilterButton"
            class="bottom-control"
            type="button"
            aria-label="Filter"
        >
            ✨
            <span>Filter</span>
        </button>


        <button
            id="startLiveButton"
            class="start-live-button"
            type="button"
        >
            🔴
            <span id="startLiveText">
                Mulai Live
            </span>
        </button>


        <button
            id="bottomFlipButton"
            class="bottom-control"
            type="button"
            aria-label="Flip Kamera"
        >
            🔄
            <span>Flip</span>
        </button>

    </footer>


    <!-- =====================================================
         LIVE TIMER
         ===================================================== -->

    <div
        id="liveTimer"
        class="live-timer"
    >
        00:00
    </div>


    <!-- =====================================================
         LIGHT STATUS
         ===================================================== -->

    <div
        id="lightStatus"
        class="light-status"
    >
        💡 Auto Light
    </div>

</div>


<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<!-- Hanya satu controller Live -->
<script src="live.js"></script>

</body>
</html>
