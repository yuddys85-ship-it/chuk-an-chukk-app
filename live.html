<!-- CAMERA SOURCE
     Video hanya menjadi sumber kamera.
     Disembunyikan agar tidak muncul dua layar.
-->
<video
    id="camera"
    class="camera-source"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="none"
    style="
        position:fixed;
        width:1px;
        height:1px;
        opacity:0;
        pointer-events:none;
    "
></video>


<!-- SATU-SATUNYA TAMPILAN KAMERA -->
<canvas
    id="filterCanvas"
    style="
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        display:block;
        background:#000;
    "
></canvas>

Jadi video asli tetap ada sebagai sumber kamera, tetapi tidak terlihat. Yang tampil hanya "filterCanvas".

⚠️ Jangan hapus elemen "<video id="camera">" sepenuhnya, karena "live.js" masih membutuhkan video tersebut untuk mengambil gambar dari kamera.

Setelah ubah → Commit changes → deploy Vercel → refresh Live.

Hasilnya harus tinggal 1 gambar kamera saja, bukan atas + bawah.
