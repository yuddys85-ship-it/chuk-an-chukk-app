<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

    <meta name="theme-color" content="#000000">

    <title>CHUK AN CHUKK - LIVE</title>

    <link rel="stylesheet" href="live.css">
</head>

<body>

<div class="live-app">

    <!-- =====================================
         LIVE HEADER
    ====================================== -->

    <header class="live-header">

        <button
            id="closeLive"
            type="button"
            aria-label="Tutup Live">
            ✕
        </button>

        <div class="live-title">
            <span class="live-dot"></span>
            <b>LIVE</b>
        </div>

        <div class="viewer-count">
            👁️ <span id="viewerCount">0</span>
        </div>

    </header>


    <!-- =====================================
         CAMERA AREA
    ====================================== -->

    <main class="camera-area">

        <video
            id="camera"
            autoplay
            muted
            playsinline>
        </video>

        <!-- Canvas untuk Dream Like Filter -->
        <canvas
            id="filterCanvas">
        </canvas>

        <!-- Status kamera -->
        <div
            id="cameraStatus"
            class="camera-status">
            📷 Menyiapkan kamera...
        </div>


        <!-- Auto Light Status -->

        <div
            id="lightStatus"
            class="light-status">

            ☀️ AUTO LIGHT

        </div>


        <!-- LIVE INFO -->

        <div class="live-info">

            <div class="host-info">

                <img
                    src="assets/logo.png"
                    alt="Host">

                <div>

                    <b>CHUK USER</b>

                    <small id="liveTime">
                        00:00
                    </small>

                </div>

            </div>


            <div class="live-actions">

                <button
                    type="button"
                    id="likeButton"
                    aria-label="Like">
                    ❤️
                </button>

                <span id="likeCount">
                    0
                </span>

            </div>

        </div>

    </main>


    <!-- =====================================
         DREAM LIKE FILTER
    ====================================== -->

    <section
        id="filterPanel"
        class="filter-panel">

        <div class="panel-title">

            <div>

                <b>
                    ✨ Dream Like
                </b>

                <small>
                    Plastic 90%
                </small>

            </div>


            <button
                id="resetFilter"
                type="button">

                Reset

            </button>

        </div>


        <!-- MAIN FILTER -->

        <div class="dream-filter-main">

            <button
                id="dreamLikeButton"
                class="dream-main-button active"
                type="button">

                <span>✨</span>

                <strong>
                    DREAM LIKE
                </strong>

                <small>
                    PLASTIC 90%
                </small>

            </button>

        </div>


        <!-- BEAUTY CONTROLS -->

        <div class="beauty-controls">


            <!-- Plastic -->

            <label>

                <div>

                    <span>
                        🧴 Plastic Skin
                    </span>

                    <b id="plasticValue">
                        90%
                    </b>

                </div>

                <input
                    id="plasticRange"
                    type="range"
                    min="0"
                    max="100"
                    value="90">

            </label>


            <!-- Glow -->

            <label>

                <div>

                    <span>
                        ✨ Dream Glow
                    </span>

                    <b id="glowValue">
                        65%
                    </b>

                </div>

                <input
                    id="glowRange"
                    type="range"
                    min="0"
                    max="100"
                    value="65">

            </label>


            <!-- Brightness -->

            <label>

                <div>

                    <span>
                        💎 Brightness
                    </span>

                    <b id="brightnessValue">
                        35%
                    </b>

                </div>

                <input
                    id="brightnessRange"
                    type="range"
                    min="0"
                    max="100"
                    value="35">

            </label>


            <!-- Soft Focus -->

            <label>

                <div>

                    <span>
                        🌸 Soft Focus
                    </span>

                    <b id="softFocusValue">
                        55%
                    </b>

                </div>

                <input
                    id="softFocusRange"
                    type="range"
                    min="0"
                    max="100"
                    value="55">

            </label>


            <!-- Face Detail -->

            <label>

                <div>

                    <span>
                        👀 Face Detail
                    </span>

                    <b id="detailValue">
                        25%
                    </b>

                </div>

                <input
                    id="detailRange"
                    type="range"
                    min="0"
                    max="100"
                    value="25">

            </label>

        </div>


        <!-- AUTO LIGHT -->

        <div class="auto-light-control">

            <div>

                <span>
                    ☀️🌙 Auto Siang / Malam
                </span>

                <small id="autoLightText">
                    Aktif — menyesuaikan cahaya otomatis
                </small>

            </div>


            <button
                id="autoLightButton"
                class="toggle active"
                type="button"
                aria-label="Auto Light">

                <span></span>

            </button>

        </div>

    </section>


    <!-- =====================================
         LIVE CONTROLS
    ====================================== -->

    <footer class="live-controls">


        <!-- CAMERA -->

        <button
            id="cameraButton"
            type="button">

            📹

            <small>
                Kamera
            </small>

        </button>


        <!-- MIC -->

        <button
            id="micButton"
            type="button">

            🎤

            <small>
                Mic
            </small>

        </button>


        <!-- START LIVE -->

        <button
            id="startLiveButton"
            class="start-live"
            type="button">

            🔴

            <small>
                Mulai Live
            </small>

        </button>


        <!-- FLIP -->

        <button
            id="flipButton"
            type="button">

            🔄

            <small>
                Flip
            </small>

        </button>


        <!-- FILTER -->

        <button
            id="filterButton"
            type="button">

            ✨

            <small>
                Filter
            </small>

        </button>

    </footer>

</div>


<!-- =====================================
     FILTER ENGINE
====================================== -->

<script src="dream-like-filter.js"></script>


<!-- =====================================
     LIVE SCRIPT
====================================== -->

<script src="live.js"></script>


</body>
</html>
