<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no">

    <title>CHUK AN CHUKK - LIVE</title>

    <link rel="stylesheet" href="live.css">
</head>

<body>

<div class="live-app">

    <header class="live-header">

        <button id="closeLive" type="button">
            ✕
        </button>

        <div class="live-title">
            <span class="live-dot"></span>
            <b>LIVE</b>
        </div>

        <div class="viewer-count">
            👁️ <span id="viewerCount">0</span>
        </div>

    </header>


    <main class="camera-area">

        <video
            id="camera"
            autoplay
            muted
            playsinline>
        </video>

        <div id="faceGlow"
             class="face-glow">
        </div>

        <div id="cameraStatus"
             class="camera-status">
            📷 Menyiapkan kamera...
        </div>


        <div class="live-info">

            <div class="host-info">

                <img
                    src="assets/logo.png"
                    alt="Host">

                <div>
                    <b>CHUK USER</b>
                    <small id="liveTime">
                        00:00
                    </small>
                </div>

            </div>


            <div class="live-actions">

                <button
                    type="button"
                    id="likeButton">
                    ❤️
                </button>

                <span id="likeCount">
                    0
                </span>

            </div>

        </div>

    </main>


    <section class="filter-panel">

        <div class="panel-title">

            <b>✨ CHUK Beauty Pro</b>

            <button
                id="resetFilter"
                type="button">
                Reset
            </button>

        </div>


        <div class="filter-list">

            <button
                class="filter-btn active"
                data-filter="beauty">

                <span>✨</span>
                <small>Beauty</small>

            </button>


            <button
                class="filter-btn"
                data-filter="smooth">

                <span>🌸</span>
                <small>Smooth</small>

            </button>


            <button
                class="filter-btn"
                data-filter="glow">

                <span>🌟</span>
                <small>Glow</small>

            </button>


            <button
                class="filter-btn"
                data-filter="warm">

                <span>☀️</span>
                <small>Warm</small>

            </button>


            <button
                class="filter-btn"
                data-filter="cool">

                <span>❄️</span>
                <small>Cool</small>

            </button>


            <button
                class="filter-btn"
                data-filter="dramatic">

                <span>🎬</span>
                <small>Dramatic</small>

            </button>


            <button
                class="filter-btn"
                data-filter="bw">

                <span>⚫</span>
                <small>B&W</small>

            </button>

        </div>


        <div class="beauty-controls">

            <label>
                <span>✨ Smooth</span>

                <input
                    id="smoothRange"
                    type="range"
                    min="0"
                    max="100"
                    value="35">
            </label>


            <label>
                <span>💡 Brightness</span>

                <input
                    id="brightnessRange"
                    type="range"
                    min="70"
                    max="140"
                    value="105">
            </label>


            <label>
                <span>🌟 Glow</span>

                <input
                    id="glowRange"
                    type="range"
                    min="0"
                    max="100"
                    value="20">
            </label>

        </div>

    </section>


    <footer class="live-controls">

        <button
            id="cameraButton"
            type="button">

            📹
            <small>Kamera</small>

        </button>


        <button
            id="micButton"
            type="button">

            🎤
            <small>Mic</small>

        </button>


        <button
            id="startLiveButton"
            class="start-live"
            type="button">

            🔴
            <small>Mulai Live</small>

        </button>


        <button
            id="flipButton"
            type="button">

            🔄
            <small>Flip</small>

        </button>


        <button
            id="filterButton"
            type="button">

            ✨
            <small>Filter</small>

        </button>

    </footer>

</div>


<script src="live.js"></script>

</body>
</html>
